<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Portfolio</title>
    <link rel="stylesheet" href="../css/style.css" />

  <body>
    <div class="header">
      <button class="cv-btn">Download CV</button>

      <div class="menu">
        <div class="menu-item">Contact</div>

        <div class="menu-item">Home</div>

      <div>
        <p class="name"><span>S</span>ina <span>Z</span>insaz</p>

        <p>
          A Front-End Developer from Kashan, focused on designing, developing,

      <div class="profile">

      </div>

      <div class="media">
        <div>
          <img
            src="../image/facebook.png"
            alt="facebook"
            class="media-icon"
          />
        </div>

        <div>
          <img
            src="../image/insta.png"
            alt="instagram"
            class="media-icon"
          />
        </div>

        <div>
          <img
            src="../image/Linkden.png"
            alt="linkedin"
            class="media-icon"
          />
        </div>

        <div>
          <img
            src="../image/teewter.png"
            alt="twitter"
            class="media-icon"
          />
        </div>
      </div>
